[project]
name = "deepswe-evals"
version = "0.1.0"
description = "Harbor tasksets that need newer verifiers (separate verifiers): DeepSWE with our own image copies, and Terminal-Bench 4"
requires-python = ">=3.12,<3.13"
dependencies = ["deep-swe", "deep-swe-upstream", "terminal-bench-4", "verifiers[harbor] @ git+https://github.com/PrimeIntellect-ai/verifiers@37e459a0"]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://hub.primeintellect.ai/primeintellect/deep-swe/install/simple/"

[tool.uv.sources]
deep-swe-upstream = { path = "deep-swe-upstream", editable = true }
terminal-bench-4 = { path = "terminal-bench-4", editable = true }
