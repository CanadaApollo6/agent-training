    "deep-swe>=0.1.0",
    "terminal-bench-2>=0.3.1",
    "verifiers[harbor] @ git+https://github.com/PrimeIntellect-ai/verifiers@aa924e7d",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://hub.primeintellect.ai/primeintellect/deep-swe/install/simple/"

