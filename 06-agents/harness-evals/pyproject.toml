[project]
name = "harness-evals"
version = "0.1.0"
description = "verifiers v1 harness evals (pi vs prime-agent) against a self-hosted model"
requires-python = ">=3.12,<3.13"
# verifiers main 50ccf5a8 + the prime-agent Rust 0.10.0 patch, built into vendor/ by vendor_verifiers.sh
dependencies = [
    "deep-swe>=0.1.0",
    "terminal-bench-2>=0.3.1",
    "tb2-lessons",
    "verifiers[harbor]",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://hub.primeintellect.ai/primeintellect/deep-swe/install/simple/"

[[tool.uv.index]]
url = "https://hub.primeintellect.ai/primeintellect/terminal-bench-2/install/simple/"

[tool.uv.sources]
tb2-lessons = { path = "tb2-lessons", editable = true }
verifiers = { path = "vendor/verifiers" }
