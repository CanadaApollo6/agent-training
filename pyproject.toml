[project]
name = "agent-training"
version = "0.1.0"
description = "Local LLM mechanics, CUDA, post-training and RL experiments on one RTX 3090"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "flash-linear-attention>=0.5.2",
    "numpy>=2.2",
    "torch>=2.14",
    "transformers>=5.17.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
